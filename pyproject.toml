[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-nl2sql"
version = "0.1.0"
description = "Modular scaffold for enterprise database understanding and NL2SQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: 需要真实 MySQL 连接的集成测试；默认跳过，设置 NL2SQL_MYSQL_INTEGRATION=1 显式启用",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# 扫描生命周期的边界必须兜底捕获任意异常以完成任务收尾（failed + finished_at），
# close 失败也必须吞掉以免覆盖主要结果；这里是刻意为之的宽捕获。
"app/services/scan_service.py" = ["BLE001", "S110"]
"app/services/semantics_service.py" = ["BLE001"]
# M3 关系运行与扫描同族：发现/验证全生命周期收尾必须兜底捕获任意异常
# （failed + finished_at + 固定安全文案），close 失败吞掉不覆盖主要结果。
"app/services/relationship_service.py" = ["BLE001", "S110"]
# 并发回归测试需捕获线程内任意异常并断言结果，不允许静默。
"tests/test_semantics_service.py" = ["BLE001"]
